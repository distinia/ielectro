<!DOCTYPE html>
<html lang="en">
<head>
    <title>News</title>
    <meta name="keywords" content="admin news, content editor, ielectro admin">
    <meta name="description" content="Create and manage news articles in the iElectro admin panel">
</head>
<body>
<div class="admin-frame">
    <div class="admin-sidebar-mount"></div>
    <div class="admin-toolbar toolbar-list">
        <button type="button" class="admin-icon-btn admin-icon-btn-primary admin-action-new" aria-label="New article" title="New article"><i data-icon="plus"></i></button>
        <button type="button" class="admin-icon-btn admin-icon-btn-danger admin-action-bulk-delete" aria-label="Delete selected" title="Delete selected" disabled><i data-icon="trash-2"></i></button>
    </div>
    <main class="admin-content admin-content-mount">
        <div class="admin-shell">
            <section class="admin-card">
                <div class="admin-list-filters">
                    <input type="search" class="admin-filter-search news-filter-q" placeholder="Search articles…" autocomplete="off" aria-label="Search news">
                    <select class="admin-filter-sort news-filter-sort" aria-label="Sort news">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="az">Title A–Z</option>
                        <option value="za">Title Z–A</option>
                    </select>
                </div>
                <div class="news-list"></div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
