<!DOCTYPE html>
<html lang="en">
<head>
    <title>Team</title>
    <meta name="keywords" content="admin team, staff profiles, ielectro admin">
    <meta name="description" content="Manage team member profiles and information">
</head>
<body>
<div class="admin-frame">
    <div class="admin-sidebar-mount"></div>
    <div class="admin-toolbar toolbar-list">
        <button type="button" class="admin-icon-btn admin-icon-btn-primary admin-action-new" aria-label="Add member" title="Add member"><i data-icon="user-plus"></i></button>
        <button type="button" class="admin-icon-btn admin-icon-btn-danger admin-action-bulk-delete" aria-label="Delete selected" title="Delete selected" disabled><i data-icon="trash-2"></i></button>
    </div>
    <main class="admin-content admin-content-mount">
        <div class="admin-shell">
            <section class="admin-card">
                <div class="admin-list-filters">
                    <input type="search" class="admin-filter-search team-filter-q" placeholder="Search members…" autocomplete="off" aria-label="Search team">
                    <select class="admin-filter-sort team-filter-sort" aria-label="Sort team">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="az">Name A–Z</option>
                        <option value="za">Name Z–A</option>
                    </select>
                </div>
                <div class="team-list"></div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
