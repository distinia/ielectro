<div class="create-shell">
    <div class="create-brand">
        <img class="create-logo" src="https://account.ielectro.com/assets/brand/logo.png" alt="iElectro">
    </div>
    <div class="create-card auth-card">
        <form id="create-by-google-form" method="post">
            <h1 class="create-tagline">Finish your iElectro account</h1>
            <input type="email" name="email" class="input-field email" placeholder="Email address" readonly>
            <div class="create-field-group"> 
                <span class="create-field-label">Birthday</span>
                <div class="birthday-selects"> 
                    <select name="day" class="birthday-select birthday-day">
                        <option value="" selected>Day</option>
                    </select> 
                    <select name="month" class="birthday-select birthday-month">
                        <option value="" selected>Month</option>
                    </select> 
                    <select name="year" class="birthday-select birthday-year">
                        <option value="" selected>Year</option>
                    </select> 
                </div>
            </div>
            <div class="create-field-group"> 
                <span class="create-field-label">Gender</span> 
                <select name="gender" class="select-field gender">
                    <option value="" selected>Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select> 
            </div>
            <div class="create-terms-card">
                <p class="create-terms-title">Terms and conditions</p>
                <p class="create-terms-lead">
                    By creating an account you agree to our rules for using iElectro services. 
                    Please read the full document before continuing.
                </p>
                <div class="terms-wrapper"> 
                    <input type="checkbox" class="terms-conditions" id="terms-conditions">
                    <label for="terms-conditions"> 
                        I have read and agree to the 
                        <a href="https://account.ielectro.com/terms-conditions" target="_blank" rel="noopener noreferrer">Terms and Conditions</a> 
                    </label>
                </div>
            </div>
            <button type="submit" class="auth-submit-btn">Create account</button>
        </form>
    </div>
</div>
