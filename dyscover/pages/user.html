<!DOCTYPE html>
<html lang="en">
<head>
    <title>User</title>
    <meta name="keywords" content="dyscover profile, user profile, social profile">
    <meta name="description" content="View and manage your Dyscover profile">
</head>
<body>
<div class="profile-page">
    <section class="profile-header">
        <div class="profile-avatar-wrap">
            <img class="avatar" alt="" src="">
        </div>
        <div class="profile-main">
            <div class="profile-top">
                <h1 class="username"></h1>
                <div class="actions"></div>
            </div>
            <div class="user-stats">
                <button type="button" class="stat-pill posts-stat">
                    <strong class="articles-number">0</strong>
                    <span>posts</span>
                </button>
                <button type="button" class="stat-pill followers-stat">
                    <strong class="followers-number">0</strong>
                    <span>followers</span>
                </button>
                <button type="button" class="stat-pill followings-stat">
                    <strong class="followings-number">0</strong>
                    <span>following</span>
                </button>
            </div>
            <div class="biography-wrap">
                <p class="biography"></p>
            </div>
        </div>
    </section>
    <section class="profile-content">
        <div class="profile-tabs" role="tablist">
            <button type="button" class="profile-tab active" data-filter="posts" title="Posts">
                <i data-icon="grid"></i><span>Posts</span>
            </button>
            <button type="button" class="profile-tab" data-filter="saved" title="Saved">
                <i data-icon="bookmark"></i><span>Saved</span>
            </button>
            <button type="button" class="profile-tab" data-filter="liked" title="Liked">
                <i data-icon="heart"></i><span>Liked</span>
            </button>
            <button type="button" class="profile-tab" data-filter="reposts" title="Reposts">
                <i data-icon="repeat"></i><span>Reposts</span>
            </button>
            <button type="button" class="profile-tab" data-filter="mentioned" title="Mentioned">
                <i data-icon="at-sign"></i><span>Mentioned</span>
            </button>
        </div>
        <div class="profile-type-tabs">
            <button type="button" class="profile-type-tab active" data-type="article">Articles</button>
            <button type="button" class="profile-type-tab" data-type="image">Images</button>
            <button type="button" class="profile-type-tab" data-type="video">Videos</button>
            <button type="button" class="profile-type-tab" data-type="audio">Audios</button>
            <button type="button" class="profile-type-tab" data-type="document">Documents</button>
            <button type="button" class="profile-type-tab" data-type="template">Templates</button>
        </div>
        <div class="profile-posts post-preview-grid"></div>
    </section>
</div>
</body>
</html>
