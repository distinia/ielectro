<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inbox</title>
    <meta name="keywords" content="dyscover inbox, messages, direct messages">
    <meta name="description" content="Read and send messages in your Dyscover inbox">
</head>
<body>
<div class="conversations">
    <div class="conversations-header">
        <h2>Inbox</h2>
        <button class="new-conversation-btn">
            <i data-icon="circle-plus"></i> New
        </button>
    </div>
    <div class="conversations-list"></div>
</div>
<div class="chat-area">
    <div class="chat-header"></div>
    <div class="chat-typing-line hidden" aria-live="polite"></div>
    <div class="chat-messages"></div>
    <div class="chat-area-composer is-chat-composer-hidden">
        <input type="file" class="attach-chat-input hidden-file-input" accept="image/*,video/*,audio/*,.pdf" hidden>
        <button class="btn attach-file attach-chat-btn" title="Attach image, video, audio, or PDF">
            <i data-icon="plus"></i>
        </button>
        <input type="text" class="input message-input" placeholder="Type a message..." autocomplete="off">
        <button class="send-message-btn" title="Send">
            <i data-icon="send"></i>
        </button>
    </div>
</div>
</body>
</html>
