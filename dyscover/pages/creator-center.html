<!DOCTYPE html>
<html lang="en">
<head>
    <title>Creator Center</title>
    <meta name="keywords" content="dyscover creator, content creation, analytics">
    <meta name="description" content="Manage your content and creator tools on Dyscover">
</head>
<body>
<div class="manager-container">
    <div class="manager-actions">
        <div class="action-buttons">
            <button class="button create"><i data-icon="circle-plus"></i> Create</button>
            <button class="button edit"><i data-icon="pencil"></i> Edit</button>
            <button class="button delete"><i data-icon="trash"></i> Delete</button>
        </div>
        <div class="number-elements"></div>
        <input type="search" class="input search-item" placeholder="Search">
    </div>
    <div class="tabs">
        <div class="tab-list">
            <center>
                <div class="tab article-tab active-tab">Articles</div>
                <div class="tab image-tab">Images</div>
                <div class="tab video-tab">Videos</div>
                <div class="tab audio-tab">Audios</div>
                <div class="tab document-tab">Documents</div>
                <div class="tab template-tab">Templates</div>
            </center>
        </div>
        <div class="section article-section">
            <div class="table-wrapper">
                <table class="table article-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section image-section">
            <div class="table-wrapper">
                <table class="table image-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section video-section">
            <div class="table-wrapper">
                <table class="table video-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section audio-section">
            <div class="table-wrapper">
                <table class="table audio-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section document-section">
            <div class="table-wrapper">
                <table class="table document-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section template-section">
            <div class="table-wrapper">
                <table class="table template-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
