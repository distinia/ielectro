<!DOCTYPE html>
<html lang="en">
<head>
    <title>Creator Center</title>
    <meta name="keywords" content="dyscover creator, content creation, analytics">
    <meta name="description" content="Manage your content and creator tools on Dyscover">
</head>
<body class="creator-page">
<div class="manager-container">
    <header class="creator-toolbar">
        <h1>Creator Center</h1>
        <div class="creator-stats number-elements"></div>
        <div class="creator-toolbar-actions">
            <div class="action-buttons">
                <button type="button" class="button action-btn create" aria-label="Create" title="Create"><i data-icon="circle-plus"></i></button>
                <button type="button" class="button action-btn edit" aria-label="Edit" title="Edit"><i data-icon="pencil"></i></button>
                <button type="button" class="button action-btn copy-link" aria-label="Copy Link" title="Copy link of selected"><i data-icon="link"></i></button>
                <button type="button" class="button action-btn download" aria-label="Download" title="Download selected"><i data-icon="download"></i></button>
                <button type="button" class="button action-btn archive" aria-label="Archive" title="Archive"><i data-icon="archive"></i></button>
                <button type="button" class="button action-btn delete" aria-label="Delete" title="Delete permanently"><i data-icon="trash"></i></button>
            </div>
            <input type="search" class="input search-item" placeholder="Search your content…">
        </div>
    </header>
    <div class="tabs creator-table">
        <div class="section article-section active-section">
            <div class="table-wrapper">
                <table class="table article-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section image-section">
            <div class="table-wrapper">
                <table class="table image-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section video-section">
            <div class="table-wrapper">
                <table class="table video-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section audio-section">
            <div class="table-wrapper">
                <table class="table audio-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section document-section">
            <div class="table-wrapper">
                <table class="table document-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="section template-section">
            <div class="table-wrapper">
                <table class="table template-table">
                    <thead class="sticky-head">
                        <tr>
                            <th><input type="checkbox" class="input-check check-all"></th>
                            <th>Name</th>
                            <th>Created</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
