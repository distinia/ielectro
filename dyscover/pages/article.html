<!DOCTYPE html>
<html lang="en">
<head>
    <title>Article</title>
    <meta name="keywords" content="dyscover article, read, blog post">
    <meta name="description" content="Read articles and posts on Dyscover">
</head>
<body>
    <main class="article-shell">
        <div class="article-stage">
            <article class="article-main-content">
                <header class="article-header">
                    <h1 class="title"></h1>
                </header>
                <div class="article-scroll">
                    <section class="content"></section>
                </div>
            </article>
            <aside class="article-index-sidebar" aria-label="Article index">
                <div class="index-sidebar-header">
                    <button type="button" class="index-edit-button" aria-label="Edit article">
                        <i data-icon="pencil"></i>
                    </button>
                    <h4>Index</h4>
                </div>
                <div class="index-sidebar-content">
                    <ul class="list" aria-label="Table of contents"></ul>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
